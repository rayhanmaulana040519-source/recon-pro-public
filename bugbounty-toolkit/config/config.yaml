# =============================================================================
# Passive bug-bounty toolkit configuration
# =============================================================================
# Every behaviour is driven from this file: nothing is hardcoded in the modules.
# Read the comments before changing a value — the scope section decides what the
# tool is allowed to touch at all.
# =============================================================================

project:
  name: "Passive Bug Bounty Toolkit"
  version: "2.1.0"
  author: "rey"

# -----------------------------------------------------------------------------
# SCOPE — the only thing standing between "passive research" and "out of scope".
#
# An entry covers itself and every subdomain (example.com covers dev.example.com).
# A leading "*." is accepted for clarity and treated the same way.
# out_of_scope always wins, even when the same host is reachable through an
# in-scope apex. strict: true also rejects bare IPs, single-label hosts and
# entries that are not valid domain names.
# -----------------------------------------------------------------------------
scope:
  in_scope:
    - "example.com"
    # - "another-program.example"   # add every apex you are authorized for

  out_of_scope:
    - "status.example.com"
    - "billing.example.com"
    # Anything the program marks out of scope belongs here, including the
    # subdomains of these entries.

  strict: true
  history_file: "data/history/scope_history.jsonl"

  # Domain tambahan yang dicatat otomatis oleh recon.sh saat kamu menjalankan
  # mode pasif (satu domain per baris, komentar dengan # diizinkan). Ini supaya
  # file ini tidak perlu diedit tangan dan komentar di config tetap utuh.
  extra_scope_file: "data/extra_scope.txt"

# -----------------------------------------------------------------------------
# HTTP — one shared, rate-limited client for the whole run.
#
# per_host_delay is the minimum number of seconds between two requests to the
# same host. Proxies are optional; when enabled, requests are rotated through the
# list, which protects your own IP. DNS lookups and every scanner that cannot use
# an HTTP proxy still leave from this host, so a proxy is not anonymity.
# -----------------------------------------------------------------------------
http:
  user_agent: "PassiveReconToolkit/1.0 (authorized bug-bounty research; passive OSINT only)"
  timeout: 15
  max_retries: 2
  per_host_delay: 1.0

  proxies:
    enabled: false
    rotate: true
    list:
      # - "http://user:password@proxy.example.net:3128"
      # - "socks5://127.0.0.1:1080"
      # - "socks5h://127.0.0.1:1080"   # DNS resolved by the proxy

# -----------------------------------------------------------------------------
# COLLECTORS — what passive data is gathered. Every collector reads public data
# or performs a single benign GET; none of them fuzzes, brute-forces or sends
# payloads.
# -----------------------------------------------------------------------------
collectors:
  certificate_transparency: true
  dns_records: true
  dns_types: ["A", "AAAA", "CNAME", "MX", "TXT", "NS", "SOA"]
  whois_rdap: true

  # HTTP header analysis: one GET per host, root path only, redirects followed.
  http_headers: true
  max_hosts: 25            # cap on hosts probed per target
  max_subdomains: 2000     # cap on names kept from all sources combined

  # One TLS handshake per probed host reads the certificate actually served
  # (issuer, dates, trust) and the negotiated protocol version. That is the only
  # way to see an expired or mismatched certificate on the wire. Like DNS, the
  # handshake leaves from this host and cannot use the HTTP proxy.
  tls_probe: true

  # Read the site's own /robots.txt once per host and record the paths it
  # disallows. Only that one standard file is fetched; no path is guessed.
  robots_txt: true

  # Wayback Machine CDX index (web.archive.org): archived URLs and the
  # hostnames they belonged to. Free, no API key. Archived URLs are a passive
  # source of endpoints and parameters; hostnames widen the subdomain set.
  wayback_cdx: true
  max_archived_urls: 300   # cap on archived URLs kept per target

  # AlienVault OTX passive DNS: hostnames that historically resolved for the
  # domain. Free; an API key only raises the rate limit. The key is read from
  # the environment variable named here and is never written to this file.
  otx_passive_dns: true
  otx_api_key_env: "OTX_API_KEY"

  # Cert Spotter: a second certificate-transparency source. Free; an API key
  # only raises the rate limit. Data merges with crt.sh, so it doubles as a
  # crt.sh fallback.
  certspotter: true
  certspotter_api_key_env: "CERTSPOTTER_API_KEY"
  max_certspotter_issuances: 100

  # Client-side JavaScript intelligence: for probed hosts, read the page's own
  # script tags, fetch only same-origin scripts, and look for exposed source
  # maps and hard-coded credentials. Every request is a GET of a file the page
  # already loads; scripts on other hosts (CDNs) are never fetched.
  js_intel: true
  max_js_files: 10         # cap on scripts fetched per host
  js_intel_max_hosts: 10   # cap on hosts that get the JS pass

  # Additional free, key-less public name sources. Every one is a different
  # dataset of historically observed hostnames, so the union of all of them is
  # wider than any single source.
  anubis: true             # Anubis dataset (jldc.me)
  rapiddns: true           # RapidDNS public index

  # Project Discovery Chaos (dns.projectdiscovery.io): subdomains observed by
  # the community. Free, but it needs a PDCP API key from
  # https://cloud.projectdiscovery.io. The key is read from the environment
  # variable named here and is never written to this file.
  chaos: true
  chaos_api_key_env: "PDCP_API_KEY"

  # Common Crawl: the world-scale web archive. Adds archived URLs alongside
  # the Wayback results.
  commoncrawl: true
  max_commoncrawl_urls: 200

  # DNS policy checks. A liveness check resolves each discovered hostname once
  # so historical noise separates from the live surface. An AXFR attempt is a
  # single standard DNS request: a correctly configured nameserver refuses it,
  # and one that answers exposes the whole zone (a critical finding).
  dns_live_check: true
  max_live_checks: 100
  dns_axfr: true

# -----------------------------------------------------------------------------
# ANALYSIS — the rule engine that turns raw data into explained findings.
# -----------------------------------------------------------------------------
analysis:
  # Ask once with a foreign Origin header to see whether CORS reflects it.
  # This is still a normal GET, but it sends a header a browser would send.
  cors_probe: true

  # Keep at most this many findings per category, highest score first, so a wide
  # target cannot turn the report into hundreds of identical rows.
  max_per_category: 10

  # CNAME targets that are takeover-prone when the service behind them was
  # deleted. Matching is a suffix match on the CNAME value.
  dangling_cname_suffixes:
    - "amazonaws.com"
    - "cloudfront.net"
    - "herokuapp.com"
    - "azurewebsites.net"
    - "cloudapp.net"
    - "trafficmanager.net"
    - "github.io"
    - "herokudns.com"
    - "netlify.app"
    - "pantheonsite.io"
    - "readthedocs.io"
    - "surge.sh"
    - "unbounce.com"
    - "zendesk.com"
    - "bitbucket.io"
    - "fastly.net"
    - "s3.amazonaws.com"
    - "wordpress.com"

  # Subdomain label fragments that usually mean a non-production surface.
  sensitive_label_hints:
    - "admin"
    - "internal"
    - "jenkins"
    - "gitlab"
    - "jira"
    - "staging"
    - "stg"
    - "dev"
    - "test"
    - "uat"
    - "preprod"
    - "backup"
    - "debug"
    - "grafana"
    - "kibana"
    - "phpmyadmin"

  # Fragments in a robots.txt Disallow path that usually mean management,
  # internal tooling or a non-production surface.
  sensitive_path_hints:
    - "admin"
    - "internal"
    - "backup"
    - "private"
    - "config"
    - "secret"
    - "debug"
    - "staging"
    - "dev"
    - "test"
    - "database"
    - "sql"
    - "upload"
    - "api"
    - "graphql"
    - "phpmyadmin"
    - "wp-admin"
    - "server-status"

# -----------------------------------------------------------------------------
# DATA — where snapshots are kept. One JSON file per run, per target.
# -----------------------------------------------------------------------------
data:
  history_dir: "data/history"

# -----------------------------------------------------------------------------
# REPORT — Markdown for humans, JSON for tooling.
# -----------------------------------------------------------------------------
report:
  output_dir: "reports"
  markdown_template: "templates/report_template.md"
  formats: ["markdown", "json"]
  include_appendix: true

# -----------------------------------------------------------------------------
# LOGGING & NOTIFICATION
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "logs/toolkit.log"
  max_bytes: 2000000
  backups: 3

notify:
  console: true
  alerts_file: "reports/alerts.jsonl"


# ----------------------------------------------------------------------------
# OPTIONAL AI TRIAGE — only sends bounded report context when --ai-summary is used.
# OpenAI is a paid external API; Ollama defaults to loopback and keeps data local.
# ----------------------------------------------------------------------------
ai:
  provider: "ollama"           # "ollama" (local) or "openai" (paid API)
  ollama_url: "http://127.0.0.1:11434/api/chat"
  ollama_model: "qwen2.5:3b"
  openai_model: "gpt-4o-mini"
  timeout: 30
  max_findings: 10
  max_changes: 10
